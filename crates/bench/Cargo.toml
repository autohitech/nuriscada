[package]
name = "nuriscada-bench"
description = "부하·지터 측정 도구 (개발·CI 전용, 배포 제외)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nuriscada-project = { path = "../project" }
nuriscada-scheduler = { path = "../scheduler" }
nuriscada-server = { path = "../server" }
nuriscada-sim-modbus = { path = "../sim-modbus" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
