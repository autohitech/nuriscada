# 의존성 라이선스·취약점 검사 설정. 규칙은 docs/requirements/dependency-license-policy.md를 따른다.
[graph]
all-features = true

[licenses]
# 허용 등급(A)과 조건부(B) 중 검토를 마친 것만 나열한다.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
