[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/driver-api",
    "crates/driver-modbus-tcp",
    "crates/scheduler",
    "crates/server",
    "crates/sim-modbus",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/autohitech/nuriscada"
authors = ["NuriScada contributors"]
publish = false

[workspace.dependencies]
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
