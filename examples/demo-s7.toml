# S7 시연용 프로젝트: `nuriscada-sim-s7 --demo`와 함께 쓴다.
#   cargo run -p nuriscada-sim-s7 -- --demo
#   cargo run -p nuriscada-server -- --config examples/demo-s7.toml --init-admin admin
#   cargo run -p nuriscada-server -- --config examples/demo-s7.toml --enable-writes
# 쓰기는 s7db 워드와 s7m 비트에 허용한다(쓰기 태그에 `writable = true`). DB 번호는 unit, s7db 주소는 바이트, s7m 주소는 비트 번호다.

[server]
listen = "127.0.0.1:8084"

[[device]]
name = "siemens1"
driver = "s7-tcp"
address = "127.0.0.1:102"
timeout_ms = 500
scan_ms = 100

[[tag]]
name = "OVEN_TEMP"
device = "siemens1"
unit = 1
space = "s7db"
address = 0
type = "analog"
unit_text = "℃"
scale = { plc_base = 0, plc_full = 100, base = 0, full = 100 }
alarm = { kind = 6, hihi = 90, high = 70, low = 30, lolo = 10, gap = 5 }

[[tag]]
name = "OVEN_RUN"
device = "siemens1"
unit = 0
space = "s7m"
address = 0
type = "digital"
alarm = { kind = 0 }
