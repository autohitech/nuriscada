# XGT 시연용 프로젝트: `nuriscada-sim-xgt --demo`와 함께 쓴다.
#   cargo run -p nuriscada-sim-xgt -- --demo
#   cargo run -p nuriscada-server -- --config examples/demo-xgt.toml --init-admin admin
#   cargo run -p nuriscada-server -- --config examples/demo-xgt.toml --enable-writes
# 쓰기는 mw·mx 영역만 허용한다. XGT 주소는 10진 번호다.

[server]
listen = "127.0.0.1:8082"

[[device]]
name = "xgt1"
driver = "xgt-fenet"
address = "127.0.0.1:2004"
timeout_ms = 500
[[tag]]
name = "LINE_TEMP"
writable = true
device = "xgt1"
space = "mw"
address = 0
type = "analog"
unit_text = "℃"
scale = { plc_base = 0, plc_full = 100, base = 0, full = 100 }
alarm = { kind = 6, hihi = 90, high = 70, low = 30, lolo = 10, gap = 5 }

[[tag]]
name = "LINE_RUN"
writable = true
device = "xgt1"
space = "mx"
address = 0
type = "digital"
alarm = { kind = 0 }
