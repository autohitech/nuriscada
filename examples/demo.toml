# 시연용 프로젝트: `nuriscada-sim-modbus --demo`와 함께 쓴다.
#   cargo run -p nuriscada-sim-modbus -- --demo
#   cargo run -p nuriscada-server -- --config examples/demo.toml
# 최초 실행 전에 --init-admin <계정>으로 관리자를 만든다. 쓰기는 --enable-writes로 별도 활성화한다.

[server]
listen = "127.0.0.1:8080"

[[device]]
name = "sim"
driver = "modbus-tcp"
address = "127.0.0.1:5020"
timeout_ms = 500
scan_ms = 100

[[tag]]
name = "TANK_LEVEL"
writable = true
device = "sim"
space = "holding"
address = 0
type = "analog"
unit_text = "%"
scale = { plc_base = 0, plc_full = 100, base = 0, full = 100 }
alarm = { kind = 6, hihi = 90, high = 70, low = 30, lolo = 10, gap = 5 }

[[tag]]
name = "PUMP_RUN"
writable = true
device = "sim"
space = "coil"
address = 0
type = "digital"
alarm = { kind = 0 }

[[screen]]
name = "주 공정 화면"
width = 800
height = 360

[[screen.widget]]
id = "w-tank-1"
kind = "tank"
label = "원수 탱크 수위"
tag = "TANK_LEVEL"
x = 40.0
y = 40.0
width = 180.0
height = 220.0
min = 0.0
max = 100.0

[[screen.widget]]
id = "w-pump-1"
kind = "pump"
label = "공급 펌프"
tag = "PUMP_RUN"
x = 260.0
y = 90.0
width = 160.0
height = 120.0

[[screen.widget]]
id = "w-gauge-1"
kind = "gauge"
label = "수위 게이지"
tag = "TANK_LEVEL"
x = 460.0
y = 90.0
width = 180.0
height = 120.0
min = 0.0
max = 100.0
