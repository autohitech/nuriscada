# MELSEC MC 시연용 프로젝트: `nuriscada-sim-melsec --demo`와 함께 쓴다.
#   cargo run -p nuriscada-sim-melsec -- --demo
#   cargo run -p nuriscada-server -- --config examples/demo-melsec.toml --init-admin admin
#   cargo run -p nuriscada-server -- --config examples/demo-melsec.toml
# MELSEC 장치는 읽기 전용이다. X·Y 주소는 16진 장치 번호다(X10 = 0x10).

[server]
listen = "127.0.0.1:8081"

[[device]]
name = "plc1"
driver = "melsec-mc"
address = "127.0.0.1:5007"
timeout_ms = 500
scan_ms = 100

[[tag]]
name = "FURNACE_TEMP"
device = "plc1"
space = "d"
address = 0
type = "analog"
unit_text = "℃"
scale = { plc_base = 0, plc_full = 100, base = 0, full = 100 }
alarm = { kind = 6, hihi = 90, high = 70, low = 30, lolo = 10, gap = 5 }

[[tag]]
name = "RUN_SIGNAL"
device = "plc1"
space = "m"
address = 0
type = "digital"
alarm = { kind = 0 }
